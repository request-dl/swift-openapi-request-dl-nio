name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
  pull_request:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
      - '.github/workflows/swift-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Swift CI"
    uses: request-dl/.github/.github/workflows/swift-ci.yml@main
    with:
      # Nome do repositório/pacote (usado para dependência local no linkage test)
      name: swift-openapi-request-dl-nio

      # Nome da biblioteca importável (usado no .product(name:package:))
      product-name: OpenAPIRequestDL

      swift-version: '6.2'
      platform: macos-26

      # Step 1
      enable-format: true
      format-swift-version: '6.3'

      # Step 2
      enable-breaking-changes: true
      skip-on-major-update: true

      # Step 3 – Apple
      enable-apple-tests: true
      package-name: "swift-openapi-request-dl-nio"
      xcode-version: '26.6'
      apple-coverage-enabled: true

      # Step 3 – Third Party
      enable-third-party-tests: true
      third-party-coverage-enabled: true
      test-foundation-essentials: true

      # Step 4
      enable-coverage-upload: true
    secrets: inherit